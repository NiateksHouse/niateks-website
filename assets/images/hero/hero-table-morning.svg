<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Dressed linen table in morning light, table setting on the right, calm plaster wall on the left</title>
  <desc id="d">Editorial still life for a textile design house: washed-linen tablecloth, stoneware plates, ceramic carafe and folded napkins on the right half; soft directional morning light rakes from the right across a lime-plaster wall, with the left 45% kept empty for typography.</desc>
  <defs>
    <linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEE9DE"/>
      <stop offset="1" stop-color="#E2DBCC"/>
    </linearGradient>
    <linearGradient id="gWallLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3EFE6" stop-opacity="0"/>
      <stop offset="1" stop-color="#F7F3EA" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D0BE"/>
      <stop offset="1" stop-color="#CFC5B0"/>
    </linearGradient>
    <linearGradient id="gCloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EDE1"/>
      <stop offset="1" stop-color="#E7E0D0"/>
    </linearGradient>
    <linearGradient id="gClothShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A463C" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#4A463C" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A463C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gPlate" cx="0.38" cy="0.34" r="0.85">
      <stop offset="0" stop-color="#EDE7D9"/>
      <stop offset="1" stop-color="#C9BEA6"/>
    </radialGradient>
    <radialGradient id="gCarafe" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#EDE7D9"/>
      <stop offset="1" stop-color="#B8AD94"/>
    </radialGradient>
    <linearGradient id="gNapkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE9DC"/>
      <stop offset="1" stop-color="#D5CCB8"/>
    </linearGradient>
  </defs>

  <!-- WALL -->
  <rect width="1600" height="620" fill="url(#gWall)"/>
  <rect width="1600" height="620" fill="url(#gWallLight)"/>
  <g opacity="0.35" fill="#E6E0D2">
    <ellipse cx="300" cy="150" rx="260" ry="120"/>
    <ellipse cx="900" cy="90" rx="300" ry="90"/>
    <ellipse cx="1350" cy="200" rx="220" ry="110"/>
    <ellipse cx="600" cy="380" rx="320" ry="140"/>
    <ellipse cx="1200" cy="430" rx="260" ry="130"/>
  </g>
  <g opacity="0.28" fill="#DED6C4">
    <ellipse cx="150" cy="450" rx="280" ry="130"/>
    <ellipse cx="760" cy="240" rx="260" ry="110"/>
    <ellipse cx="1480" cy="480" rx="240" ry="120"/>
  </g>

  <!-- FLOOR -->
  <rect y="620" width="1600" height="280" fill="url(#gFloor)"/>
  <rect y="612" width="1600" height="10" fill="#C4BAA4" opacity="0.55"/>

  <!-- TABLE CLOTH -->
  <rect y="636" width="1600" height="264" fill="url(#gCloth)"/>
  <rect y="636" width="1600" height="264" fill="url(#gClothShade)"/>
  <g stroke="#DDD5C3" stroke-width="1.2" opacity="0.5">
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
    <line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="0" y1="840" x2="1600" y2="840"/>
  </g>
  <line x1="0" y1="856" x2="1600" y2="856" stroke="#D2C9B5" stroke-width="2"/>

  <!-- OBJECT SHADOWS -->
  <ellipse cx="1120" cy="700" rx="300" ry="26" fill="#4A463C" opacity="0.12"/>
  <ellipse cx="1230" cy="742" rx="230" ry="20" fill="#4A463C" opacity="0.10"/>
  <ellipse cx="1380" cy="716" rx="150" ry="16" fill="#4A463C" opacity="0.12"/>

  <!-- CARAFE (behind) -->
  <path d="M1195 568 q14 -30 20 -44 q6 14 20 44 q18 40 18 92 q0 54 -38 54 q-38 0 -38 -54 q0 -52 18 -92 Z" fill="url(#gCarafe)"/>
  <ellipse cx="1215" cy="566" rx="22" ry="7" fill="#A99D82"/>
  <ellipse cx="1215" cy="566" rx="14" ry="4" fill="#8F8468"/>

  <!-- DINNER PLATE (front) -->
  <ellipse cx="1000" cy="706" rx="118" ry="34" fill="url(#gPlate)"/>
  <ellipse cx="1000" cy="700" rx="118" ry="34" fill="#EFE9DB"/>
  <ellipse cx="1000" cy="700" rx="86" ry="24" fill="#E4DCCB"/>
  <ellipse cx="1000" cy="700" rx="52" ry="14" fill="#DAD1BD"/>

  <!-- SECOND PLATE (behind) -->
  <ellipse cx="1140" cy="688" rx="104" ry="30" fill="#E9E2D2"/>
  <ellipse cx="1140" cy="682" rx="104" ry="30" fill="#F0EADC"/>
  <ellipse cx="1140" cy="682" rx="72" ry="20" fill="#E2D9C6"/>

  <!-- FOLDED NAPKINS -->
  <rect x="856" y="676" width="108" height="58" rx="4" fill="url(#gNapkin)"/>
  <rect x="856" y="676" width="108" height="16" fill="#E6DFCE" opacity="0.8"/>
  <line x1="856" y1="734" x2="964" y2="734" stroke="#C8BFA9" stroke-width="2"/>
  <rect x="1290" y="690" width="96" height="52" rx="4" fill="#ECE5D4"/>
  <rect x="1290" y="690" width="96" height="14" fill="#E0D8C4" opacity="0.8"/>

  <!-- OLIVE BRANCH -->
  <g stroke="#6E7360" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M1338 664 q30 -60 88 -92"/>
    <path d="M1358 636 q26 -8 44 -28"/>
    <path d="M1382 612 q30 -10 48 -34"/>
  </g>
  <g fill="#73765E">
    <ellipse cx="1340" cy="668" rx="16" ry="6" transform="rotate(-38 1340 668)"/>
    <ellipse cx="1362" cy="640" rx="16" ry="6" transform="rotate(-30 1362 640)"/>
    <ellipse cx="1390" cy="618" rx="15" ry="6" transform="rotate(-22 1390 618)"/>
    <ellipse cx="1416" cy="596" rx="15" ry="6" transform="rotate(-30 1416 596)"/>
    <ellipse cx="1440" cy="580" rx="14" ry="6" transform="rotate(-22 1440 580)"/>
    <ellipse cx="1352" cy="622" rx="14" ry="6" transform="rotate(-52 1352 622)"/>
    <ellipse cx="1378" cy="600" rx="14" ry="6" transform="rotate(-44 1378 600)"/>
  </g>
  <g fill="#B66A4A" opacity="0.9">
    <circle cx="1370" cy="660" r="5"/>
    <circle cx="1398" cy="636" r="4.5"/>
    <circle cx="1420" cy="606" r="4"/>
  </g>
  <g fill="#7A7E66" opacity="0.8">
    <circle cx="1372" cy="652" r="3.4"/>
    <circle cx="1400" cy="628" r="3.2"/>
    <circle cx="1424" cy="600" r="3"/>
  </g>

  <!-- FALLEN OLIVE -->
  <ellipse cx="1462" cy="704" rx="12" ry="5" fill="#73765E"/>
  <ellipse cx="1462" cy="701" rx="10" ry="4" fill="#8A8D74"/>

  <!-- LONG MORNING SHADOWS -->
  <g fill="#4A463C">
    <ellipse cx="820" cy="716" rx="180" ry="12" opacity="0.07"/>
    <ellipse cx="940" cy="756" rx="240" ry="13" opacity="0.05"/>
    <ellipse cx="1120" cy="790" rx="300" ry="14" opacity="0.05"/>
  </g>
</svg>
