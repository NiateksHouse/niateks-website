<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Extreme close-up of natural linen weave</title>
  <desc id="d">Macro study of woven linen: visible warp and weft threads with natural slubs, raking side-light revealing the weave relief across the whole frame.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EDE6D5"/><stop offset="1" stop-color="#DFD6C1"/></linearGradient>
    <linearGradient id="rakeW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A463C" stop-opacity="0.10"/><stop offset="0.5" stop-color="#4A463C" stop-opacity="0"/><stop offset="1" stop-color="#F8F4EB" stop-opacity="0.5"/></linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#base)"/>

  <!-- warp threads (vertical) -->
  <g stroke="#E7E0CE" stroke-width="14" opacity="0.85">
    <line x1="30" y1="0" x2="30" y2="1250"/><line x1="90" y1="0" x2="90" y2="1250"/><line x1="150" y1="0" x2="150" y2="1250"/>
    <line x1="210" y1="0" x2="210" y2="1250"/><line x1="270" y1="0" x2="270" y2="1250"/><line x1="330" y1="0" x2="330" y2="1250"/>
    <line x1="390" y1="0" x2="390" y2="1250"/><line x1="450" y1="0" x2="450" y2="1250"/><line x1="510" y1="0" x2="510" y2="1250"/>
    <line x1="570" y1="0" x2="570" y2="1250"/><line x1="630" y1="0" x2="630" y2="1250"/><line x1="690" y1="0" x2="690" y2="1250"/>
    <line x1="750" y1="0" x2="750" y2="1250"/><line x1="810" y1="0" x2="810" y2="1250"/><line x1="870" y1="0" x2="870" y2="1250"/>
    <line x1="930" y1="0" x2="930" y2="1250"/>
  </g>
  <!-- weft threads (horizontal) -->
  <g stroke="#D8CEB6" stroke-width="13" opacity="0.9">
    <line x1="0" y1="35" x2="1000" y2="35"/><line x1="0" y1="95" x2="1000" y2="95"/><line x1="0" y1="155" x2="1000" y2="155"/>
    <line x1="0" y1="215" x2="1000" y2="215"/><line x1="0" y1="275" x2="1000" y2="275"/><line x1="0" y1="335" x2="1000" y2="335"/>
    <line x1="0" y1="395" x2="1000" y2="395"/><line x1="0" y1="455" x2="1000" y2="455"/><line x1="0" y1="515" x2="1000" y2="515"/>
    <line x1="0" y1="575" x2="1000" y2="575"/><line x1="0" y1="635" x2="1000" y2="635"/><line x1="0" y1="695" x2="1000" y2="695"/>
    <line x1="0" y1="755" x2="1000" y2="755"/><line x1="0" y1="815" x2="1000" y2="815"/><line x1="0" y1="875" x2="1000" y2="875"/>
    <line x1="0" y1="935" x2="1000" y2="935"/><line x1="0" y1="995" x2="1000" y2="995"/><line x1="0" y1="1055" x2="1000" y2="1055"/>
    <line x1="0" y1="1115" x2="1000" y2="1115"/><line x1="0" y1="1175" x2="1000" y2="1175"/>
  </g>
  <!-- thread shading for relief -->
  <g stroke="#C9BFA6" stroke-width="3" opacity="0.5">
    <line x1="0" y1="42" x2="1000" y2="42"/><line x1="0" y1="102" x2="1000" y2="102"/><line x1="0" y1="162" x2="1000" y2="162"/>
    <line x1="0" y1="222" x2="1000" y2="222"/><line x1="0" y1="282" x2="1000" y2="282"/><line x1="0" y1="342" x2="1000" y2="342"/>
    <line x1="0" y1="402" x2="1000" y2="402"/><line x1="0" y1="462" x2="1000" y2="462"/><line x1="0" y1="522" x2="1000" y2="522"/>
    <line x1="0" y1="582" x2="1000" y2="582"/><line x1="0" y1="642" x2="1000" y2="642"/><line x1="0" y1="702" x2="1000" y2="702"/>
    <line x1="0" y1="762" x2="1000" y2="762"/><line x1="0" y1="822" x2="1000" y2="822"/><line x1="0" y1="882" x2="1000" y2="882"/>
    <line x1="0" y1="942" x2="1000" y2="942"/><line x1="0" y1="1002" x2="1000" y2="1002"/><line x1="0" y1="1062" x2="1000" y2="1062"/>
    <line x1="0" y1="1122" x2="1000" y2="1122"/><line x1="0" y1="1182" x2="1000" y2="1182"/>
  </g>
  <!-- natural slubs -->
  <g stroke="#C4B99E" stroke-width="16" stroke-linecap="round" opacity="0.75">
    <line x1="150" y1="275" x2="196" y2="275"/>
    <line x1="570" y1="635" x2="622" y2="635"/>
    <line x1="330" y1="935" x2="376" y2="935"/>
    <line x1="750" y1="395" x2="796" y2="395"/>
  </g>
  <g stroke="#EDE6D5" stroke-width="16" stroke-linecap="round" opacity="0.9">
    <line x1="450" y1="515" x2="486" y2="515"/>
    <line x1="870" y1="815" x2="908" y2="815"/>
    <line x1="90" y1="1055" x2="130" y2="1055"/>
  </g>
  <!-- raking light -->
  <rect width="1000" height="1250" fill="url(#rakeW)"/>
</svg>
