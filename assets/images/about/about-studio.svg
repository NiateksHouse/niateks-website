<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Material library in the Niateks House studio</title>
  <desc id="d">Open oak shelving holding the studio material library: folded linen stacks, small styled rolls and fabric swatches in warm neutral tones; soft daylight, no people.</desc>
  <defs>
    <linearGradient id="wallS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEAE0"/><stop offset="1" stop-color="#E3DCCC"/></linearGradient>
    <linearGradient id="rakeS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F1E8" stop-opacity="0"/><stop offset="1" stop-color="#F8F4EB" stop-opacity="0.85"/></linearGradient>
    <linearGradient id="woodS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C3B291"/><stop offset="1" stop-color="#B2A07D"/></linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1ECE0"/><stop offset="1" stop-color="#DFD6C1"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAE2D0"/><stop offset="1" stop-color="#D8CEB6"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E3DAC6"/><stop offset="1" stop-color="#D0C5AA"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#wallS)"/>
  <rect width="1200" height="800" fill="url(#rakeS)"/>

  <!-- shelf uprights -->
  <rect x="60" y="60" width="18" height="680" fill="url(#woodS)"/>
  <rect x="1122" y="60" width="18" height="680" fill="url(#woodS)"/>

  <!-- shelf 1 -->
  <rect x="60" y="250" width="1080" height="16" fill="url(#woodS)"/>
  <g>
    <rect x="130" y="160" width="220" height="90" rx="5" fill="url(#s1)"/>
    <rect x="130" y="160" width="220" height="18" fill="#F8F3E7" opacity="0.7"/>
    <rect x="380" y="140" width="260" height="110" rx="5" fill="url(#s2)"/>
    <rect x="380" y="140" width="260" height="20" fill="#F6F1E3" opacity="0.7"/>
    <g stroke="#C9BFA6" stroke-width="1.6" opacity="0.5">
      <line x1="398" y1="158" x2="446" y2="230"/><line x1="446" y1="158" x2="494" y2="230"/><line x1="494" y1="158" x2="542" y2="230"/><line x1="542" y1="158" x2="590" y2="230"/>
    </g>
    <!-- small styled rolls -->
    <g>
      <ellipse cx="760" cy="182" rx="26" ry="68" fill="url(#s3)"/>
      <ellipse cx="760" cy="182" rx="12" ry="52" fill="#C4B899"/>
      <ellipse cx="820" cy="190" rx="22" ry="60" fill="url(#s1)"/>
      <ellipse cx="820" cy="190" rx="10" ry="44" fill="#CEC2A2"/>
      <ellipse cx="872" cy="196" rx="18" ry="54" fill="url(#s2)"/>
    </g>
    <!-- swatch stack -->
    <rect x="940" y="180" width="180" height="70" rx="5" fill="url(#s3)"/>
    <rect x="940" y="180" width="180" height="14" fill="#EFE9D9" opacity="0.8"/>
    <g stroke="#B66A4A" stroke-width="2" opacity="0.8"><line x1="960" y1="236" x2="1100" y2="236" stroke-dasharray="1 9" stroke-linecap="round"/></g>
  </g>

  <!-- shelf 2 -->
  <rect x="60" y="500" width="1080" height="16" fill="url(#woodS)"/>
  <g>
    <rect x="150" y="400" width="300" height="100" rx="5" fill="url(#s2)"/>
    <rect x="150" y="400" width="300" height="20" fill="#F7F2E4" opacity="0.7"/>
    <rect x="480" y="420" width="220" height="80" rx="5" fill="url(#s3)"/>
    <rect x="480" y="420" width="220" height="16" fill="#F2ECDC" opacity="0.7"/>
    <g stroke="#B66A4A" stroke-width="2" opacity="0.8"><line x1="500" y1="484" x2="680" y2="484" stroke-dasharray="1 9" stroke-linecap="round"/></g>
    <g>
      <ellipse cx="810" cy="430" rx="30" ry="70" fill="url(#s1)"/>
      <ellipse cx="810" cy="430" rx="14" ry="54" fill="#C9BD9E"/>
      <ellipse cx="876" cy="438" rx="24" ry="62" fill="url(#s2)"/>
      <ellipse cx="936" cy="444" rx="20" ry="56" fill="url(#s3)"/>
    </g>
    <rect x="990" y="416" width="130" height="84" rx="5" fill="url(#s1)"/>
    <rect x="990" y="416" width="130" height="16" fill="#F6F1E3" opacity="0.75"/>
  </g>

  <!-- base shelf / work surface -->
  <rect x="60" y="740" width="1080" height="18" fill="url(#woodS)"/>

  <!-- cast shadows under objects -->
  <g fill="#4A463C" opacity="0.12">
    <ellipse cx="240" cy="252" rx="140" ry="8"/>
    <ellipse cx="510" cy="252" rx="160" ry="8"/>
    <ellipse cx="1030" cy="252" rx="110" ry="8"/>
    <ellipse cx="300" cy="502" rx="180" ry="8"/>
    <ellipse cx="590" cy="502" rx="130" ry="8"/>
    <ellipse cx="1055" cy="502" rx="90" ry="8"/>
  </g>

  <!-- window light on floor edge -->
  <rect y="780" width="1200" height="20" fill="#D9CDB2"/>
  <polygon points="900,0 1200,0 1200,800 700,800" fill="#F7F3EA" opacity="0.14"/>
</svg>
