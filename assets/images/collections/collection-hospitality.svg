<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Restaurant tables dressed in natural linen, empty room before service</title>
  <desc id="d">A quiet hospitality dining room before service: rows of round tables in washed-linen covers with folded napkins and glassware, oak chairs, tall windows with soft daylight. Room depth conveys contract scale; no people.</desc>
  <defs>
    <linearGradient id="wallH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE8DD"/><stop offset="1" stop-color="#E0D9C8"/></linearGradient>
    <linearGradient id="winH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F4EB"/><stop offset="1" stop-color="#EAE4D4"/></linearGradient>
    <linearGradient id="floorH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D3C7AD"/><stop offset="1" stop-color="#C6B99C"/></linearGradient>
    <linearGradient id="clothH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEE2"/><stop offset="1" stop-color="#E4DCCB"/></linearGradient>
  </defs>

  <!-- wall + windows -->
  <rect width="1200" height="560" fill="url(#wallH)"/>
  <g>
    <rect x="90" y="70" width="180" height="360" fill="url(#winH)"/>
    <rect x="330" y="70" width="180" height="360" fill="url(#winH)"/>
    <rect x="690" y="70" width="180" height="360" fill="url(#winH)"/>
    <rect x="930" y="70" width="180" height="360" fill="url(#winH)"/>
    <g stroke="#C8BFA9" stroke-width="8"><line x1="180" y1="70" x2="180" y2="430"/><line x1="420" y1="70" x2="420" y2="430"/><line x1="780" mullion="0" y1="70" x2="780" y2="430"/><line x1="1020" y1="70" x2="1020" y2="430"/></g>
  </g>

  <!-- floor -->
  <rect y="560" width="1200" height="340" fill="url(#floorH)"/>
  <rect y="554" width="1200" height="8" fill="#B7A988" opacity="0.55"/>
  <!-- floor boards -->
  <g stroke="#BFB398" stroke-width="2" opacity="0.5">
    <line x1="0" y1="640" x2="1200" y2="640"/><line x1="0" y1="740" x2="1200" y2="740"/><line x1="0" y1="830" y2="830" x2="1200" y2="830"/>
  </g>

  <!-- BACK TABLE (smaller, higher) -->
  <g>
    <ellipse cx="600" cy="560" rx="210" ry="40" fill="#B4A88C" opacity="0.30"/>
    <ellipse cx="600" cy="540" rx="200" ry="40" fill="url(#clothH)"/>
    <path d="M400 540 q200 46 400 0 l0 44 q-200 40 -400 0 Z" fill="#DAD1BC"/>
    <ellipse cx="540" cy="538" rx="44" ry="13" fill="#EFE9DB"/>
    <ellipse cx="540" cy="538" rx="30" ry="9" fill="#DFD6C1"/>
    <path d="M636 500 l10 0 5 52 q-14 7 -30 0 Z" fill="#DDE0D2" opacity="0.9"/>
    <ellipse cx="668" cy="530" rx="18" ry="8" fill="#EFE9DB"/>
  </g>

  <!-- FRONT TABLE (larger, lower) -->
  <g>
    <ellipse cx="600" cy="812" rx="360" ry="52" fill="#B4A88C" opacity="0.30"/>
    <ellipse cx="600" cy="788" rx="350" ry="54" fill="url(#clothH)"/>
    <path d="M250 788 q350 70 700 0 l0 52 q-350 62 -700 0 Z" fill="#D8CFBA"/>
    <ellipse cx="470" cy="782" rx="64" ry="18" fill="#F0EADC"/>
    <ellipse cx="470" cy="782" rx="44" ry="12" fill="#E0D7C2"/>
    <path d="M596 706 l14 0 7 84 q-19 9 -42 0 Z" fill="#DDE0D2" opacity="0.92"/>
    <ellipse cx="740" cy="776" rx="34" ry="11" fill="#ECE5D3"/>
    <rect x="700" y="760" width="84" height="34" rx="4" fill="#E6DFCC"/>
    <rect x="700" y="760" width="84" height="9" fill="#F5F0E2" opacity="0.7"/>
  </g>

  <!-- oak chair silhouettes (simple, calm) -->
  <g fill="#B09A72" opacity="0.85">
    <rect x="300" y="470" width="14" height="90" rx="4"/>
    <rect x="368" y="470" width="14" height="90" rx="4"/>
    <rect x="300" y="470" width="82" height="12" rx="4"/>
    <rect x="820" y="470" width="14" height="90" rx="4"/>
    <rect x="888" y="470" width="14" height="90" rx="4"/>
    <rect x="820" y="470" width="82" height="12" rx="4"/>
  </g>

  <!-- long window light on floor -->
  <polygon points="90,560 270,560 210,900 40,900" fill="#F7F3EA" opacity="0.35"/>
  <polygon points="930,560 1110,560 1160,900 990,900" fill="#F7F3EA" opacity="0.28"/>
</svg>
