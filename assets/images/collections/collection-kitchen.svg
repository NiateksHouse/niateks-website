<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="t d">
  <title id="t">Natural linen kitchen textiles on a wooden counter</title>
  <desc id="d">A minimal kitchen counter in pale oak with a washed-linen tea towel draped over the counter edge and a linen apron hanging on a wooden rail behind; soft directional daylight, warm neutral palette.</desc>
  <defs>
    <linearGradient id="wallK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEAE0"/><stop offset="1" stop-color="#E2DBCB"/></linearGradient>
    <linearGradient id="rakeK" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F1E8" stop-opacity="0"/><stop offset="1" stop-color="#F8F4EB" stop-opacity="0.9"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8CCB2"/><stop offset="1" stop-color="#C9BB9F"/></linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2EDE0"/><stop offset="1" stop-color="#DAD1BB"/></linearGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDE6D6"/><stop offset="1" stop-color="#D6CCB4"/></linearGradient>
  </defs>
  <rect width="1200" height="470" fill="url(#wallK)"/>
  <rect width="1200" height="470" fill="url(#rakeK)"/>
  <g opacity="0.3" fill="#E7E1D3"><ellipse cx="300" cy="140" rx="300" ry="120"/><ellipse cx="880" cy="220" rx="300" ry="130"/></g>

  <!-- wooden rail + apron -->
  <line x1="640" y1="118" x2="1120" y2="118" stroke="#A08A64" stroke-width="10" stroke-linecap="round"/>
  <path d="M780 128 q60 -10 120 0 l16 250 q-76 14 -152 0 Z" fill="url(#apron)"/>
  <path d="M806 132 q34 -18 68 0 l0 22 q-34 -12 -68 0 Z" fill="#C9BFA6"/>
  <g stroke="#B66A4A" stroke-width="2" opacity="0.8"><line x1="800" y1="340" x2="912" y2="340" stroke-dasharray="1 9" stroke-linecap="round"/></g>

  <!-- counter -->
  <rect y="470" width="1200" height="330" fill="url(#counter)"/>
  <rect y="462" width="1200" height="10" fill="#B3A482" opacity="0.6"/>

  <!-- draped tea towel -->
  <path d="M236 462 q66 -26 132 0 l10 226 q-14 22 -40 22 l-72 0 q-26 0 -40 -22 Z" fill="url(#towel)"/>
  <path d="M300 462 q34 22 34 96 l0 152" stroke="#CBC1A8" stroke-width="2" fill="none" opacity="0.7"/>
  <path d="M262 462 q-14 60 -8 244" stroke="#E8E1CF" stroke-width="3" fill="none" opacity="0.8"/>
  <g stroke="#B66A4A" stroke-width="2.5" opacity="0.85"><line x1="252" y1="640" x2="366" y2="640" stroke-dasharray="1 10" stroke-linecap="round"/></g>

  <!-- small bowl -->
  <ellipse cx="560" cy="474" rx="64" ry="18" fill="#B7AB8F"/>
  <path d="M496 468 q64 40 128 0 l0 6 q-64 34 -128 0 Z" fill="#CFC3A7"/>
  <ellipse cx="560" cy="468" rx="64" ry="16" fill="#E8E1CF"/>

  <!-- shadows -->
  <ellipse cx="560" cy="500" rx="120" ry="14" fill="#4A463C" opacity="0.10"/>
  <ellipse cx="302" cy="712" rx="120" ry="14" fill="#4A463C" opacity="0.10"/>
</svg>
